name: RN CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sdk:
    name: SDK typecheck and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

  android-example:
    name: Bare RN Android release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci
        working-directory: examples/BareRNExample

      - run: ./gradlew assembleRelease
        working-directory: examples/BareRNExample/android

      - uses: actions/upload-artifact@v4
        with:
          name: bare-rn-release-apk
          path: examples/BareRNExample/android/app/build/outputs/apk/release/app-release.apk

  upload-testmu-app:
    name: Upload APK to TestMu
    runs-on: ubuntu-latest
    needs: android-example
    outputs:
      enabled: ${{ steps.testmu-creds.outputs.present }}
      app_url: ${{ steps.upload-app.outputs.app_url }}

    steps:
      - uses: actions/checkout@v4

      - id: testmu-creds
        name: Check TestMu credentials
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          if [ -n "$LT_USERNAME" ] && [ -n "$LT_ACCESS_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Skipping TestMu smoke because LT_USERNAME or LT_ACCESS_KEY is not configured."
          fi

      - uses: actions/setup-node@v4
        if: steps.testmu-creds.outputs.present == 'true'
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        if: steps.testmu-creds.outputs.present == 'true'
        with:
          name: bare-rn-release-apk
          path: artifacts/android

      - name: Prune old TestMu CI uploads
        if: steps.testmu-creds.outputs.present == 'true'
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          response="$(curl -sS -u "$LT_USERNAME:$LT_ACCESS_KEY" \
            --location --request GET "https://manual-api.lambdatest.com/app/data?type=android&level=user")"

          app_ids="$(APP_DATA="$response" node - <<'NODE'
          const keepNames = new Set(["KittenTTS_RN_Release_28200662906"]);
          const response = JSON.parse(process.env.APP_DATA || "{}");
          const apps = Array.isArray(response.data) ? response.data : [];
          const ids = apps
            .filter((app) => {
              const name = String(app.name || "");
              return (
                name.startsWith("KittenTTS_RN_CI_") ||
                (name.startsWith("KittenTTS_RN_Release_") && !keepNames.has(name))
              );
            })
            .map((app) => app.app_id || app.appId || app.id)
            .filter(Boolean);
          process.stdout.write(ids.join(","));
          NODE
          )"

          if [ -n "$app_ids" ]; then
            curl -sS -u "$LT_USERNAME:$LT_ACCESS_KEY" \
              --location --request DELETE "https://manual-api.lambdatest.com/app/delete" \
              --header "Content-Type: application/json" \
              --data-raw "{\"appIds\":\"$app_ids\"}"
            echo
          else
            echo "No old TestMu CI uploads to prune."
          fi

      - id: upload-app
        name: Upload APK to TestMu
        if: steps.testmu-creds.outputs.present == 'true'
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          response="$(curl -sS -u "$LT_USERNAME:$LT_ACCESS_KEY" \
            --location --request POST "https://manual-api.lambdatest.com/app/upload/realDevice" \
            --form "name=KittenTTS_RN_CI_${GITHUB_RUN_ID}" \
            --form "appFile=@artifacts/android/app-release.apk")"

          app_url="$(UPLOAD_RESPONSE="$response" node - <<'NODE'
          const response = JSON.parse(process.env.UPLOAD_RESPONSE);
          const appUrl = response.app_url || response.appUrl || response.app || response.url;
          if (!appUrl || !String(appUrl).startsWith('lt://')) {
            throw new Error(`Unable to find lt:// app URL in response: ${JSON.stringify(response)}`);
          }
          process.stdout.write(appUrl);
          NODE
          )"

          echo "app_url=$app_url" >> "$GITHUB_OUTPUT"

  testmu-android-benchmark:
    name: TestMu Android benchmark (${{ matrix.device }})
    runs-on: ubuntu-latest
    needs: upload-testmu-app
    if: needs.upload-testmu-app.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slug: pixel-5
            device: Pixel 5
            version: "12"
          - slug: galaxy-note10
            device: Galaxy Note10
            version: "12"
          - slug: galaxy-s22-ultra-5g
            device: Galaxy S22 Ultra 5G
            version: "12"
          - slug: galaxy-s21
            device: Galaxy S21
            version: "12"
          - slug: xiaomi-redmi-note-8
            device: Xiaomi Redmi Note 8
            version: "10"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Appium harness
        run: npm ci
        working-directory: e2e/appium

      - name: Run TestMu Android benchmark
        id: run-benchmark
        continue-on-error: true
        timeout-minutes: 12
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          TESTMU_APP_URL: ${{ needs.upload-testmu-app.outputs.app_url }}
          TESTMU_ANDROID_DEVICE: ${{ matrix.device }}
          TESTMU_ANDROID_VERSION: ${{ matrix.version }}
          TESTMU_REAL_DEVICE: true
          TESTMU_BENCHMARK_REPORT_TIMEOUT_MS: 540000
          TESTMU_SAMPLE_TEXT: ${{ vars.TESTMU_SAMPLE_TEXT || 'Hello! Welcome to KittenTTS, a fast on-device text-to-speech engine.' }}
        run: |
          mkdir -p reports
          set +e
          set -o pipefail
          timeout 10m npm run test:android 2>&1 | tee reports/appium-output.log
          status="${PIPESTATUS[0]}"
          if [ "$status" -eq 124 ]; then
            echo "Timed out after 10 minutes while waiting for the TestMu/Appium benchmark to finish." | tee -a reports/appium-output.log
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
        working-directory: e2e/appium

      - name: Write device failure report
        if: steps.run-benchmark.outcome == 'failure'
        env:
          TESTMU_ANDROID_DEVICE: ${{ matrix.device }}
          TESTMU_ANDROID_VERSION: ${{ matrix.version }}
          TESTMU_SAMPLE_TEXT: ${{ vars.TESTMU_SAMPLE_TEXT || 'Hello! Welcome to KittenTTS, a fast on-device text-to-speech engine.' }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BENCHMARK_EXIT_CODE: ${{ steps.run-benchmark.outputs.exit_code }}
        run: |
          mkdir -p e2e/appium/reports
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function stripAnsi(value) {
            return String(value || '').replace(/\x1b\[[0-9;]*m/g, '');
          }

          function compactLogTail(value) {
            return stripAnsi(value)
              .split(/\r?\n/)
              .filter(Boolean)
              .slice(-80)
              .join('\n');
          }

          const logPath = path.join('e2e/appium/reports', 'appium-output.log');
          const logText = fs.existsSync(logPath)
            ? fs.readFileSync(logPath, 'utf8')
            : '';
          const cleanLog = stripAnsi(logText);
          const errorLine =
            cleanLog
              .split(/\r?\n/)
              .reverse()
              .find((line) =>
                /App showed error-banner|Timed out waiting|Error:|Timeout|no such element|FAILED/i.test(line),
              ) || 'The Appium benchmark step failed.';
          const slug = String(process.env.TESTMU_ANDROID_DEVICE || 'device')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-|-$/g, '');
          const report = {
            schemaVersion: 1,
            status: 'failed',
            failedStage: 'Run TestMu Android benchmark',
            errorSummary: errorLine.trim(),
            errorDetails: [
              `Device: ${process.env.TESTMU_ANDROID_DEVICE}`,
              `Android version: ${process.env.TESTMU_ANDROID_VERSION}`,
              `Exit code: ${process.env.BENCHMARK_EXIT_CODE || '1'}`,
              `Workflow run: ${process.env.GITHUB_RUN_URL}`,
              '',
              compactLogTail(logText),
            ].join('\n'),
            device: process.env.TESTMU_ANDROID_DEVICE,
            platformName: 'Android',
            platformVersion: process.env.TESTMU_ANDROID_VERSION,
            realDevice: true,
            sessionId: null,
            githubRunId: process.env.GITHUB_RUN_ID || null,
            githubSha: process.env.GITHUB_SHA || null,
            capturedAt: new Date().toISOString(),
            sampleText: process.env.TESTMU_SAMPLE_TEXT || null,
            characterLength: process.env.TESTMU_SAMPLE_TEXT
              ? Array.from(process.env.TESTMU_SAMPLE_TEXT).length
              : null,
            rows: [],
          };

          fs.writeFileSync(
            path.join('e2e/appium/reports', `${slug}.json`),
            `${JSON.stringify(report, null, 2)}\n`,
          );
          NODE

      - name: Upload device benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testmu-benchmark-${{ matrix.slug }}
          path: e2e/appium/reports/*.json
          if-no-files-found: warn

  testmu-benchmark-report:
    name: TestMu benchmark report
    runs-on: ubuntu-latest
    needs:
      - upload-testmu-app
      - testmu-android-benchmark
    if: always() && needs.upload-testmu-app.outputs.enabled == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: testmu-benchmark-*
          path: benchmark-results
          merge-multiple: true

      - name: Build benchmark report
        run: node e2e/appium/scripts/build-benchmark-report.js benchmark-results benchmark-report

      - name: Upload combined benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: testmu-benchmark-report
          path: benchmark-report/*

      - name: Add report to job summary
        run: cat benchmark-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment benchmark report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const sha = context.payload.pull_request.head.sha;
            const marker = `<!-- kittentts-testmu-benchmark-report:${sha} -->`;
            const report = fs.readFileSync('benchmark-report/pr-comment.md', 'utf8');
            const body = `${marker}\n${report}`;
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.data.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (previous) {
              core.info(`Updating benchmark report comment for commit ${sha}.`);
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              core.info(`Creating benchmark report comment for commit ${sha}.`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
