        env:
          TESTMU_TARGET: web
          TESTMU_DEVICE: Pixel 8
          TESTMU_PLATFORM_NAME: Android
          TESTMU_PLATFORM_VERSION: "14"
          TESTMU_BROWSER_NAME: Chrome
          TESTMU_WEB_URL: "http://localhost.lambdatest.com:4173?benchmarkModels=kitten-tts-nano-0.8&benchmarkWarmRuns=1&benchmarkText=KittenTTS%20web%20benchmark.&benchmarkIncludeAudio=false&benchmarkAutoStart=true"
          TESTMU_TUNNEL_NAME: kittentts-web-${{ github.run_id }}-pixel-8-chrome
          TESTMU_REAL_DEVICE: true
          TESTMU_SAMPLE_TEXT: KittenTTS browser benchmark.
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BENCHMARK_EXIT_CODE: ${{ steps.run-web-benchmark.outputs.exit_code }}
          BENCHMARK_STARTED_AT_MS: ${{ steps.benchmark-clock.outputs.started_at_ms }}
          BENCHMARK_FINISHED_AT_MS: ${{ steps.run-web-benchmark.outputs.finished_at_ms }}
          BENCHMARK_TOTAL_RUNTIME_SECONDS: ${{ steps.run-web-benchmark.outputs.total_runtime_seconds }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          TUNNEL_OUTCOME: ${{ steps.tunnel.outcome }}
          RUN_OUTCOME: ${{ steps.run-web-benchmark.outcome }}
        run: |
          stage="Run TestMu web browser benchmark"
          if [ "$PREVIEW_OUTCOME" = "failure" ]; then
            stage="Start web benchmark preview"
            cat reports/web-preview.log >> reports/appium-output.log 2>/dev/null || true
