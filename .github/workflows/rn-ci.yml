          TESTMU_EXPECTED_MODELS: kitten-tts-nano-0.8
          TESTMU_EXPECTED_WARM_RUNS: "1"
          TESTMU_REQUIRE_WER_AUDIO: false
          TESTMU_WEB_SMOKE_ONLY: true
          TESTMU_SAMPLE_TEXT: KittenTTS browser benchmark.
        run: |
          mkdir -p reports
          set +e
          setsid bash -lc 'npm run test:web:browser' > reports/appium-output.log 2>&1 &
          appium_pid="$!"
          deadline=$((SECONDS + 600))
          status=0
          while kill -0 "$appium_pid" 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              status=124
              echo "Timed out after 10 minutes while waiting for the TestMu/Appium mobile browser benchmark to finish." >> reports/appium-output.log
              kill -TERM "-$appium_pid" 2>/dev/null || kill -TERM "$appium_pid" 2>/dev/null || true
              sleep 5
              kill -KILL "-$appium_pid" 2>/dev/null || kill -KILL "$appium_pid" 2>/dev/null || true
              break
            fi
            sleep 5
          done
          if [ "$status" -eq 0 ]; then
