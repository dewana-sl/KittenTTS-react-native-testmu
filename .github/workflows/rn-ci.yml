  testmu-benchmark-report:
    name: TestMu benchmark report
    runs-on: ubuntu-latest
    needs:
      - testmu-web-browser-benchmark
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: testmu-benchmark-*
          path: benchmark-results
          merge-multiple: true

      - name: Upload benchmark WAV audio to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_DRIVE_PUBLIC_AUDIO: ${{ vars.GOOGLE_DRIVE_PUBLIC_AUDIO || 'false' }}
          GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          TESTMU_SDK_FOLDER: RN SDK
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && [ -n "$GOOGLE_DRIVE_ROOT_FOLDER_ID" ]; then
            python3 -m pip install --upgrade pip
            python3 -m pip install google-api-python-client==2.177.0 google-auth==2.40.3
          else
            echo "Google Drive upload is not configured; audio links will be marked skipped."
          fi
          python3 e2e/appium/scripts/upload-audio-to-google-drive.py benchmark-results

      - name: Annotate WER with Parakeet
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -n "$NVIDIA_API_KEY" ]; then
            python3 -m pip install --upgrade pip
            python3 -m pip install nvidia-riva-client==2.26.0
          else
            echo "NVIDIA_API_KEY is not configured; Parakeet WER rows will be marked skipped."
          fi
          python3 e2e/appium/scripts/annotate-wer-with-parakeet.py benchmark-results --strip-audio

      - name: Build benchmark report
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node e2e/appium/scripts/build-benchmark-report.js benchmark-results benchmark-report

      - name: Upload combined benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: testmu-benchmark-report
          path: benchmark-report/*

      - name: Add report to job summary
        run: cat benchmark-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment benchmark report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const sha = context.payload.pull_request.head.sha;
            const marker = `<!-- kittentts-testmu-benchmark-report:${sha} -->`;
            const report = fs.readFileSync('benchmark-report/pr-comment.md', 'utf8');
            const body = `${marker}\n${report}`;
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.data.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (previous) {
              core.info(`Updating benchmark report comment for commit ${sha}.`);
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              core.info(`Creating benchmark report comment for commit ${sha}.`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail on benchmark failures
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('benchmark-report/summary.json', 'utf8'));
          const failedReports = summary.reports.filter(
            (report) => report.status === 'failed' || report.status === 'partial',
          );
          const failedRows = summary.reports.flatMap((report) =>
            (report.rows || [])
              .filter((row) => row.status === 'failed')
              .map((row) => `${report.device}: ${row.modelDisplayName || row.model}: ${row.errorSummary || row.failedStage || 'failed'}`),
          );
          if (failedReports.length || failedRows.length) {
            console.error(`Benchmark failures: ${failedReports.length} device report(s), ${failedRows.length} model row(s).`);
            for (const report of failedReports) {
              console.error(`${report.device}: ${report.errorSummary || report.failedStage || report.status}`);
            }
            for (const row of failedRows) {
              console.error(row);
            }
            process.exit(1);
          }
          console.log('No benchmark failures found.');
          NODE
