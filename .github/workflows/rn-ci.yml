          path: e2e/appium/reports/*
          if-no-files-found: warn

      - name: Fail browser job if benchmark failed
        if: steps.preview.outcome == 'failure' || steps.tunnel.outcome == 'failure' || steps.run-web-benchmark.outcome == 'failure'
