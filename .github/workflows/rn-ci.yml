            status="$?"
          else
            wait "$appium_pid" >/dev/null 2>&1 || true
          fi
          tail -240 reports/appium-output.log || true
          finished_at_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
          total_runtime_seconds="$(node -e "process.stdout.write(((Number(process.argv[2]) - Number(process.argv[1])) / 1000).toFixed(3))" "${{ steps.benchmark-clock.outputs.started_at_ms }}" "$finished_at_ms")"
